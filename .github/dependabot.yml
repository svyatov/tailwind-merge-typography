version: 2
updates:
  # Feeds new @tailwindcss/typography releases in as PRs so the drift test in
  # test/drift.test.ts runs against each one. `increase` bumps the exact pin, so every release
  # is a distinct PR, and the entry stays ungrouped so each one is testable on its own.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    versioning-strategy: increase

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
